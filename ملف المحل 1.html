<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12395f">
<link rel="manifest" href="manifest.json">
<title>NASA Store POS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;color:#162433}
header{position:sticky;top:0;z-index:5;background:#12395f;color:#fff;padding:15px 16px;display:flex;justify-content:space-between}
main{padding:14px 12px 90px}.screen{display:none}.screen.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.panel{background:#fff;border-radius:14px;padding:15px;margin-top:12px;box-shadow:0 2px 8px #0001}.card b{display:block;font-size:20px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:7px 0}.field label{font-size:12px;color:#667;display:block;margin-bottom:4px}
input,select{width:100%;padding:11px;border:1px solid #d4dce4;border-radius:9px;font-size:15px;background:#fff}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:700}.primary{background:#1769aa;color:white}.danger{background:#c0392b;color:white}.full{width:100%}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:white;padding:9px 2px;font-size:11px}.bottom button.active{color:#1769aa;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #edf0f2;text-align:right}th{background:#eef3f7}.scroll{overflow:auto}
</style>
</head>
<body>
<header><b>📱 NASA Store POS</b><span id="clock"></span></header>
<main>
<section id="home" class="screen active"><h2>لوحة التحكم</h2>
<div class="cards">
<div class="card">المبيعات<b id="sales">0 ج</b></div><div class="card">الأرباح<b id="profit">0 ج</b></div>
<div class="card">المخزون<b id="stock">0 ج</b></div><div class="card">الأصناف<b id="items">0</b></div>
</div><div class="panel"><b>النظام جاهز</b><p>هذه النسخة مجهزة للرفع على استضافة مجانية، وبعد الرفع يمكن فتحها من Safari وإضافتها للشاشة الرئيسية.</p></div>
</section>

<section id="sell" class="screen"><h2>🛒 بيع</h2><div class="panel">
<div class="field"><label>كود الصنف</label><input id="sc"></div><div class="field"><label>اسم الصنف</label><input id="sn"></div>
<div class="field"><label>IMEI</label><input id="si" inputmode="numeric"></div>
<div class="grid"><div class="field"><label>الكمية</label><input id="sq" type="number" value="1"></div><div class="field"><label>سعر البيع</label><input id="sp" type="number"></div></div>
<div class="grid"><div class="field"><label>الخصم</label><input id="sd" type="number" value="0"></div><div class="field"><label>طريقة الدفع</label><select id="sm"><option>كاش</option><option>InstaPay</option><option>تحويل</option><option>بطاقة</option><option>آجل</option></select></div></div>
<button class="btn primary full" onclick="sell()">تسجيل البيع</button></div></section>

<section id="buy" class="screen"><h2>📥 شراء</h2><div class="panel">
<div class="field"><label>كود الصنف</label><input id="bc"></div><div class="field"><label>اسم الصنف</label><input id="bn"></div>
<div class="field"><label>IMEI</label><input id="bi" inputmode="numeric"></div>
<div class="grid"><div class="field"><label>الكمية</label><input id="bq" type="number" value="1"></div><div class="field"><label>سعر الشراء</label><input id="bk" type="number"></div></div>
<div class="field"><label>سعر البيع</label><input id="bp" type="number"></div>
<button class="btn primary full" onclick="buy()">إضافة للمخزون</button></div></section>

<section id="stockScreen" class="screen"><h2>📦 المخزون</h2><input id="search" placeholder="ابحث بالاسم أو الكود أو IMEI" oninput="renderStock()">
<div class="panel scroll"><table><thead><tr><th>الصنف</th><th>IMEI</th><th>الكمية</th><th>شراء</th><th>بيع</th></tr></thead><tbody id="rows"></tbody></table></div></section>

<section id="more" class="screen"><h2>⚙️ النظام</h2><div class="panel">
<button class="btn primary full" onclick="backup()">حفظ نسخة احتياطية</button><br><br>
<label class="btn primary full" style="display:block;text-align:center">استرجاع نسخة<input type="file" hidden accept=".json" onchange="restore(event)"></label><br><br>
<button class="btn danger full" onclick="wipe()">مسح البيانات</button></div></section>
</main>
<nav class="bottom">
<button class="active" onclick="go('home',this)">🏠<br>الرئيسية</button>
<button onclick="go('sell',this)">🛒<br>بيع</button>
<button onclick="go('buy',this)">📥<br>شراء</button>
<button onclick="go('stockScreen',this)">📦<br>المخزون</button>
<button onclick="go('more',this)">⚙️<br>المزيد</button>
</nav>
<script>
const K="nasa_pos_v3";let db=JSON.parse(localStorage.getItem(K)||'{"items":[],"sales":[],"buys":[]}');
const $=x=>document.getElementById(x),m=n=>(+n||0).toLocaleString("ar-EG");
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function go(id,b){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function buy(){let c=$("bc").value.trim(),n=$("bn").value.trim(),i=$("bi").value.trim(),q=+$("bq").value||1,k=+$("bk").value||0,p=+$("bp").value||0;if(!c||!n||k<=0)return alert("أدخل الكود والاسم وسعر الشراء");if(i&&db.items.some(x=>x.imei===i))return alert("IMEI موجود بالفعل");db.items.push({code:c,name:n,imei:i,qty:q,cost:k,price:p,status:"متاح"});db.buys.push({date:new Date().toISOString(),code:c,name:n,imei:i,qty:q,cost:k,total:q*k});save();alert("تمت الإضافة")}
function sell(){let c=$("sc").value.trim(),i=$("si").value.trim(),q=+$("sq").value||1,p=+$("sp").value||0,d=+$("sd").value||0,x=db.items.find(x=>x.code===c&&(!i||x.imei===i)&&x.qty>=q);if(!x)return alert("الصنف أو IMEI غير موجود");let net=p*q-d;if(net<0)return alert("الخصم أكبر من البيع");x.qty-=q;if(!x.qty)x.status="مباع";db.sales.push({date:new Date().toISOString(),code:c,name:$("sn").value||x.name,imei:i,qty:q,net,cost:x.cost,profit:net-x.cost*q,pay:$("sm").value});save();alert("تم تسجيل البيع")}
function render(){let s=db.sales.reduce((a,x)=>a+x.net,0),p=db.sales.reduce((a,x)=>a+x.profit,0),v=db.items.reduce((a,x)=>a+x.cost*x.qty,0);$("sales").textContent=m(s)+" ج";$("profit").textContent=m(p)+" ج";$("stock").textContent=m(v)+" ج";$("items").textContent=db.items.filter(x=>x.qty>0).length;renderStock()}
function renderStock(){let q=($("search")?.value||"").toLowerCase();$("rows").innerHTML=db.items.filter(x=>(x.name+" "+x.code+" "+x.imei).toLowerCase().includes(q)).map(x=>`<tr><td>${x.name}<br>${x.code}</td><td>${x.imei||"-"}</td><td>${x.qty}</td><td>${m(x.cost)}</td><td>${m(x.price)}</td></tr>`).join("")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="nasa-store-backup.json";a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert("تم الاسترجاع")}catch{alert("الملف غير صالح")}};r.readAsText(e.target.files[0])}
function wipe(){if(confirm("حذف كل البيانات؟")){db={items:[],sales:[],buys:[]};save()}}
setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}),1000);render();
</script>
</body></html>
